name: Import index.wasm

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download index.wasm from release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download wasm-v1.4 --pattern 'index.wasm' --dir /tmp/wasm
      - name: Commit index.wasm to repo root
        run: |
          sha256sum /tmp/wasm/index.wasm
          cp /tmp/wasm/index.wasm ./index.wasm
          ls -la index.wasm
          git config user.name "mmk03130-code"
          git config user.email "mmk03130-code@users.noreply.github.com"
          git add index.wasm
          git commit -m "Add index.wasm v1.4 (Godot web engine)" || echo "index.wasm unchanged - nothing to commit"
          git push
